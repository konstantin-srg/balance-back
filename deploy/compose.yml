services:
  nginx:
    container_name: nginx
    image: nginx:alpine
    volumes:
      - ./../src:/var/www/backend
      - ./nginx/vhosts.conf:/etc/nginx/conf.d/default.conf
    ports:
      - '90:90'
    networks:
      - backend
    depends_on:
      - php
  php:
    container_name: php
    build:
      context: .
      dockerfile: ./php/Dockerfile
    environment:
      config: public
    volumes:
      - ./../src:/var/www/backend
    networks:
      - backend
    depends_on:
      - db
  db:
    container_name: db
    image: mysql:9.6.0
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: asdqwezxc
    networks:
      - backend
    volumes:
      - ./mysql/mysql-data:/var/lib/mysql
  phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin:5.2.3-apache
    ports:
      - 1500:80
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    networks:
      - backend

networks:
  backend:
    driver: bridge